<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leonardo Disaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080807;
    --text: #c8c4ba;
    --muted: #5a5750;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'EB Garamond', serif;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  body {
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .logo-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 0;
  }

  .logo-img {
    width: clamp(260px, 40vw, 480px);
  }

  .contact {
    position: fixed;
    bottom: 3rem;
    left: 3.5rem;
    z-index: 1;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .contact li {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .contact-label {
    font-size: 1rem;
    color: #8B0000;
    text-shadow: 0 0 20px rgba(180,0,0,0.5), 0 0 60px rgba(160,0,0,0.3), 0 0 100px rgba(140,0,0,0.15);
  }

  .contact-value {
    font-size: 1rem;
    color: #8B0000;
    text-decoration: none;
    text-shadow: 0 0 20px rgba(180,0,0,0.5), 0 0 60px rgba(160,0,0,0.3), 0 0 100px rgba(140,0,0,0.15);
    transition: color 0.2s ease, text-shadow 0.2s ease;
  }

  .contact-value:hover {
    color: #aa0000;
    text-shadow: 0 0 20px rgba(200,0,0,0.7), 0 0 60px rgba(180,0,0,0.4), 0 0 120px rgba(160,0,0,0.2);
  }

  /* --- TAKING ORDERS banner --- */
  .banner {
    position: fixed;
    top: clamp(0.75rem, 5vh, 3rem);
    right: 0;
    z-index: 2;
    display: block;
    width: clamp(115px, 16vw, 240px);
    transform-origin: 100% 8%;
    animation:
      banner-in 1.3s cubic-bezier(0.2, 0.9, 0.25, 1.12) 0.5s both,
      banner-sway 5.5s ease-in-out 1.8s infinite alternate;
  }

  .banner-svg {
    display: block;
    width: 100%;
    height: auto;
    transform-origin: 100% 8%;
    transition: rotate 0.7s cubic-bezier(0.3, 1.5, 0.5, 1);
  }

  /* a gust of wind lifts the free end */
  .banner:hover .banner-svg,
  .banner:focus-visible .banner-svg { rotate: 3deg; }

  .banner:focus-visible { outline: 1px solid #8B0000; outline-offset: 4px; }

  @keyframes banner-in {
    from { transform: translateX(105%) rotate(5deg); }
    to   { transform: translateX(0) rotate(0deg); }
  }

  @keyframes banner-sway {
    from { transform: rotate(0deg) skewY(0deg); }
    to   { transform: rotate(1.4deg) skewY(0.6deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .banner { animation: none; }
    .banner-svg { transition: none; }
    .banner:hover .banner-svg { rotate: none; }
  }
</style>
</head>
<body>

<div class="logo-wrap">
  <video autoplay loop muted playsinline class="logo-img">
    <source src="Comp 1_1.mp4" type="video/mp4">
  </video>
</div>

<ul class="contact">
  <li>
    <span class="contact-label">Mail</span>

  <li>
    <span class="contact-label">Instagram</span>
    <a href="https://instagram.com/leonardo_disaster" target="_blank" rel="noopener" class="contact-value">@leonardo_disaster</a>
  </li>
</ul>
