<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leonardo Disaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080807;
    --text: #c8c4ba;
    --muted: #5a5750;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'EB Garamond', serif;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  body {
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .logo-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 0;
  }

  .logo-img {
    width: clamp(260px, 40vw, 480px);
  }

  .contact {
    position: fixed;
    bottom: 3rem;
    left: 3.5rem;
    z-index: 1;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .contact li {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .contact-label {
    font-size: 1rem;
    color: #8B0000;
    text-shadow: 0 0 20px rgba(180,0,0,0.5), 0 0 60px rgba(160,0,0,0.3), 0 0 100px rgba(140,0,0,0.15);
  }

  .contact-value {
    font-size: 1rem;
    color: #8B0000;
    text-decoration: none;
    text-shadow: 0 0 20px rgba(180,0,0,0.5), 0 0 60px rgba(160,0,0,0.3), 0 0 100px rgba(140,0,0,0.15);
    transition: color 0.2s ease, text-shadow 0.2s ease;
  }

  .contact-value:hover {
    color: #aa0000;
    text-shadow: 0 0 20px rgba(200,0,0,0.7), 0 0 60px rgba(180,0,0,0.4), 0 0 120px rgba(160,0,0,0.2);
  }

  /* --- face cursor --- */
  .face-cursor,
  .face-cursor * { cursor: none; }

  .cursor-face {
    position: fixed;
    top: 0;
    left: 0;
    width: 104px;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
    will-change: transform, filter;
    transition: opacity 0.4s ease, filter 0.5s ease;
    filter: drop-shadow(0 0 18px rgba(140,0,0,0.3)) drop-shadow(0 0 0 rgba(160,0,0,0));
  }

  .cursor-face.is-live { opacity: 1; }

  .cursor-face.is-hot {
    filter: drop-shadow(0 0 22px rgba(200,0,0,0.75)) drop-shadow(0 0 70px rgba(160,0,0,0.35));
  }

  /* two baked layers, cross-faded: black and white at rest, red on hover */
  .cursor-face img {
    display: block;
    width: 100%;
  }

  .cursor-face .cf-red {
    position: absolute;
    top: 0;
    left: 0;
    opacity: 0;
    transition: opacity 0.45s ease;
  }

  .cursor-face.is-hot .cf-red { opacity: 1; }

  @media (pointer: coarse), (prefers-reduced-motion: reduce) {
    .cursor-face { display: none; }
    .face-cursor, .face-cursor * { cursor: auto; }
  }
</style>
</head>

<script>
(function () {
  if (!window.matchMedia('(pointer: fine)').matches) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var face = document.querySelector('.cursor-face');
  if (!face) return;

  document.body.classList.add('face-cursor');

  var tx = window.innerWidth / 2, ty = window.innerHeight / 2;
  var x = tx, y = ty, px = x, live = false, hot = false, s = 1;

  window.addEventListener('mousemove', function (e) {
    tx = e.clientX;
    ty = e.clientY;
    if (!live) { x = tx; y = ty; px = x; live = true; face.classList.add('is-live'); }
  }, { passive: true });

  document.addEventListener('mouseleave', function () { face.classList.remove('is-live'); });
  document.addEventListener('mouseenter', function () { if (live) face.classList.add('is-live'); });

  document.addEventListener('mouseover', function (e) {
    hot = !!(e.target.closest && e.target.closest('a, .contact-value'));
    face.classList.toggle('is-hot', hot);
  });

  (function frame() {
    x += (tx - x) * 0.16;
    y += (ty - y) * 0.16;
    s += ((hot ? 0.5 : 1) - s) * 0.14;
    var tilt = Math.max(-14, Math.min(14, (x - px) * 0.9));
    px = x;
    face.style.transform =
      'translate3d(' + (x - 52) + 'px,' + (y - 80) + 'px,0) rotate(' + tilt + 'deg) scale(' + s + ')';
    requestAnimationFrame(frame);
  })();
})();
</script>
