<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leonardo Disaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080807;
    --text: #c8c4ba;
    --muted: #5a5750;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'EB Garamond', serif;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  body {
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .logo-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 0;
  }

  .logo-img {
    width: clamp(260px, 40vw, 480px);
  }

  .contact {
    position: fixed;
    bottom: 3rem;
    left: 3.5rem;
    z-index: 1;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .contact li {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }

  .contact-label {
    font-size: 1rem;
    color: #8B0000;
    text-shadow: 0 0 20px rgba(180,0,0,0.5), 0 0 60px rgba(160,0,0,0.3), 0 0 100px rgba(140,0,0,0.15);
  }

  .contact-value {
    font-size: 1rem;
    color: #8B0000;
    text-decoration: none;
    text-shadow: 0 0 20px rgba(180,0,0,0.5), 0 0 60px rgba(160,0,0,0.3), 0 0 100px rgba(140,0,0,0.15);
    transition: color 0.2s ease, text-shadow 0.2s ease;
  }

  .contact-value:hover {
    color: #aa0000;
    text-shadow: 0 0 20px rgba(200,0,0,0.7), 0 0 60px rgba(180,0,0,0.4), 0 0 120px rgba(160,0,0,0.2);
  }


  /* Instagram glyph: the official glyph file is used as a mask and filled red,
     so it takes the site's red whatever colour the downloaded file is */
  .contact-ig {
    display: block;
    width: 26px;
    height: 26px;
    filter:
      drop-shadow(0 0 6px rgba(200,0,0,0.85))
      drop-shadow(0 0 22px rgba(170,0,0,0.55));
    transition: filter 0.2s ease;
  }

  .ig-glyph {
    display: block;
    width: 100%;
    height: 100%;
    background: #8B0000;
    -webkit-mask: url("instagram.svg") center / contain no-repeat;
            mask: url("instagram.svg") center / contain no-repeat;
    transition: background-color 0.2s ease;
  }

  .contact-ig:hover {
    filter:
      drop-shadow(0 0 8px rgba(220,0,0,1))
      drop-shadow(0 0 28px rgba(190,0,0,0.7));
  }

  .contact-ig:hover .ig-glyph { background: #aa0000; }

  .contact-ig:focus-visible { outline: 1px solid #8B0000; outline-offset: 4px; }

  /* --- TAKING ORDERS badge: pixel terminal button --- */
  .badge {
    --s: 1.5;                               /* pixel scale: 1.5 = crisp 3x3 dots on retina */
    position: fixed;
    right: 3.5rem;                          /* mirrors the Instagram glyph on the left */
    bottom: calc(3rem + 13px - 47px * var(--s) / 2);   /* centred on the glyph */
    z-index: 2;
    display: block;
    width: calc(198px * var(--s));
    filter:
      drop-shadow(0 0 14px rgba(180,0,0,0.5))
      drop-shadow(0 0 40px rgba(160,0,0,0.28));
    transition: filter 0.25s ease;
    animation: badge-on 0.45s steps(1, end) 0.5s both;
  }

  .badge:hover,
  .badge:focus-visible {
    filter:
      drop-shadow(0 0 16px rgba(210,0,0,0.75))
      drop-shadow(0 0 48px rgba(180,0,0,0.42));
  }

  .badge:focus-visible { outline: 1px solid #8B0000; outline-offset: 4px; }

  .badge-img {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* black cover over the text, clipped away one character at a time */
  .badge-type {
    position: absolute;
    left: 22.7273%;
    top: 31.9149%;
    width: 69.6970%;
    height: 42.5532%;
    background: #000;
    clip-path: inset(0 0 0 92.7536%);
    animation: badge-type 1.200s steps(16, end) 1.15s both;
  }

  .badge-cursor {
    position: absolute;
    left: 87.8788%;
    top: 38.2979%;
    width: 3.0303%;
    height: 19.1489%;
    background: rgb(246,226,229);
    animation:
      badge-cursor-walk 1.200s steps(16, end) 1.15s both,
      badge-blink 1.06s steps(1, end) 2.350s infinite;
  }

  /* switches on like an old monitor */
  @keyframes badge-on {
    0%   { opacity: 0; }
    20%  { opacity: 1; }
    35%  { opacity: 0.15; }
    55%  { opacity: 1; }
    70%  { opacity: 0.6; }
    85%  { opacity: 1; }
  }

  @keyframes badge-type {
    from { clip-path: inset(0 0 0 0); }
    to   { clip-path: inset(0 0 0 92.7536%); }
  }

  @keyframes badge-cursor-walk {
    from { left: 23.2323%; }
    to   { left: 87.8788%; }
  }

  @keyframes badge-blink {
    0%  { opacity: 1; }
    50% { opacity: 0; }
  }

  @media (max-width: 640px) {
    .badge { --s: 1; right: 1.25rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .badge, .badge-type, .badge-cursor { animation: none; }
  }
</style>
</head>
<body>

      <span class="ig-glyph"></span>

  </li>
</ul>
